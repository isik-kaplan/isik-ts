name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.os-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        os-version: [ubuntu-22.04]

    runs-on: ${{ matrix.os-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build package
        run: npm run build
